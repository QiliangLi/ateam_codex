<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cat Cafe CLI Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>Cat Cafe CLI Chat</h1>
          <p>在网页里发起 A2A 调用，查看 CLI 输出与回传消息。</p>
        </div>
        <div class="status">
          <span id="statusText">连接中…</span>
        </div>
      </header>

      <section class="panel">
        <div class="field">
          <label>Thread</label>
          <input id="threadId" value="demo" />
        </div>
        <div class="field">
          <label>猫猫</label>
          <div id="cats" class="cats"></div>
        </div>
        <div class="field">
          <label>Prompt</label>
          <textarea id="prompt" rows="4" placeholder="输入任务，比如：请写一段总结并 @缅因猫 review"></textarea>
        </div>
        <div class="actions">
          <button id="runBtn">Run</button>
          <button id="clearBtn" class="ghost">Clear</button>
        </div>
      </section>

      <section class="panel">
        <h2>Events</h2>
        <div id="log" class="log"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
