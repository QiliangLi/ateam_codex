<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cat Cafe Thread</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="composer">
        <div class="brand">
          <h1>Cat Cafe</h1>
          <p>多猫协作线程</p>
        </div>

        <div class="card field">
          <label for="threadId">Thread</label>
          <input id="threadId" value="demo" />
        </div>

        <div class="card field">
          <label>猫猫成员</label>
          <div id="cats" class="cats"></div>
        </div>

        <div class="card field">
          <label for="prompt">Prompt</label>
          <textarea id="prompt" rows="6" placeholder="例如：请先给出方案，再 @缅因猫 做审阅"></textarea>
        </div>

        <div class="actions">
          <button id="runBtn">开始运行</button>
          <button id="clearBtn" class="ghost">清空线程</button>
        </div>
      </aside>

      <section class="thread-panel">
        <header class="thread-header">
          <div>
            <h2>Game Thread</h2>
            <p>参考猫猫黑手党对话风格的多色消息流</p>
          </div>
          <div class="status-pill"><span id="statusText">连接中…</span></div>
        </header>

        <div id="log" class="thread"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
